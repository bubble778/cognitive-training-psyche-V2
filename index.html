<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cognitive Game Lab V2</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f7f9;
  color:#17202a;
}

.app{
  max-width:800px;
  margin:auto;
  padding:24px 16px 50px;
}

header{text-align:center;margin-bottom:24px}

.eyebrow{
  font-size:12px;
  letter-spacing:2px;
  color:#6b7480;
  font-weight:700;
}

h1{margin:6px 0;font-size:30px}

.muted{color:#6b7480}

.hidden{display:none!important}

.games{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.game-card{
  min-height:125px;
  padding:18px;
  text-align:left;
  border:1px solid #dce1e6;
  border-radius:18px;
  background:white;
  cursor:pointer;
}

.game-card:hover{
  border-color:#9ba5af;
}

.game-card b{
  display:block;
  font-size:17px;
  margin-bottom:7px;
}

.game-card span{
  font-size:14px;
  color:#6b7480;
}

button{
  font:inherit;
  cursor:pointer;
}

.primary,.secondary{
  min-height:44px;
  padding:10px 16px;
  border-radius:12px;
  border:1px solid #dce1e6;
}

.primary{
  background:#e7edf4;
  font-weight:700;
}

.secondary{
  background:white;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.topbar small{
  display:block;
  color:#6b7480;
  margin-top:3px;
}

.panel{
  background:white;
  border:1px solid #dce1e6;
  border-radius:20px;
  padding:22px;
  text-align:center;
}

#arena{
  min-height:270px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  width:min(440px,100%);
}

.tile{
  aspect-ratio:1;
  border:1px solid #dce1e6;
  border-radius:13px;
  background:#fafbfc;
  font-size:22px;
}

.tile.active{
  background:#dce7f2;
}

.tile.correct{
  background:#d8e9dc;
}

.tile.wrong{
  opacity:.45;
}

.big-stimulus{
  font-size:62px;
  font-weight:800;
  user-select:none;
}

.choice-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  width:min(450px,100%);
}

.choice{
  min-height:55px;
  border:1px solid #dce1e6;
  border-radius:13px;
  background:white;
}

.choice:hover{
  background:#f4f6f8;
}

.reaction{
  width:220px;
  height:180px;
  border-radius:22px;
  border:1px solid #dce1e6;
  background:#f8fafb;
  font-size:22px;
  font-weight:700;
}

.reaction.ready{
  background:#e5ebf1;
}

.score-list{
  display:grid;
  gap:18px;
}

.score-row{
  display:grid;
  gap:6px;
}

.score-header{
  display:flex;
  justify-content:space-between;
}

.bar{
  height:9px;
  background:#edf0f3;
  border-radius:99px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  background:#8d99a6;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:18px 0;
}

.stat{
  background:#f6f8fa;
  border-radius:12px;
  padding:12px 6px;
}

.stat b{
  display:block;
  font-size:19px;
}

.stat span{
  font-size:11px;
  color:#6b7480;
}

.note{
  font-size:12px;
  color:#6b7480;
  margin-top:24px;
}

#feedback{
  min-height:25px;
  margin-top:12px;
}

.tower{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:30px;
  height:210px;
}
